
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111c;color:white;font-family:Tahoma,Arial;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100dvh;background:#091725}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.panel{background:#102538dd;border:1px solid #31516b;border-radius:12px;padding:9px 12px;font-size:13px}
#controls{position:fixed;bottom:20px;left:20px;width:145px;height:145px;border-radius:50%;background:#ffffff15;border:2px solid #ffffff55;z-index:8;touch-action:none}
#stick{position:absolute;width:58px;height:58px;border-radius:50%;background:#22d3eeaa;border:2px solid white;left:42px;top:42px;pointer-events:none}
#buttons{position:fixed;bottom:30px;right:18px;z-index:8;display:flex;flex-direction:column;gap:10px}
button{border:1px solid #4b7895;background:#12344b;color:white;border-radius:12px;padding:12px 17px;font-size:14px;font-weight:bold}
button:active{transform:scale(.95);background:#087c91}
#menu{position:fixed;inset:0;background:#06111eef;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#menuBox{width:min(360px,100%);background:#10283b;border:1px solid #34708d;border-radius:22px;padding:25px;text-align:center}
h1{color:#36d9ed;margin:0 0 8px}
#menu p{color:#c5d8e5;line-height:1.9;font-size:14px}
#start{width:100%;background:#087f91;font-size:17px;padding:15px}
.small{font-size:12px;color:#9db6c8}
.hidden{display:none!important}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="panel">🏆 امتیاز: <b id="score">0</b></div>
 <div class="panel">🪙 سکه: <b id="coins">0</b></div>
 <div class="panel">🐍 رکورد: <b id="record">0</b></div>
</div>

<div id="controls"><div id="stick"></div></div>

<div id="buttons">
 <button id="pause">⏸ توقف</button>
 <button id="restart">🔄 شروع دوباره</button>
</div>

<div id="menu">
 <div id="menuBox">
  <h1>🐍 SNAKE ARENA</h1>
  <p>آماده‌ای وارد میدان بشی؟</p>
  <p>با جوی‌استیک حرکت کن و آزادانه ۳۶۰ درجه بچرخ!</p>
  <p class="small">با خوردن غذا بزرگ شو و با ربات‌ها رقابت کن.</p>
  <button id="start">شروع بازی</button>
 </div>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const recordEl=document.getElementById("record");
const menu=document.getElementById("menu");
const pad=document.getElementById("controls");
const stick=document.getElementById("stick");

let W=0,H=0,dpr=1;
let running=false,paused=false,gameOver=false;
let score=0;
let coins=Number(localStorage.getItem("snakeCoins")||0);
let record=Number(localStorage.getItem("snakeRecord")||0);

const WORLD={w:2400,h:1800};
const food=[];
const snakes=[];
const PLAYER_SPEED=2.9;
const BOT_SPEED=2.05;
const TURN_SPEED=0.085;

let player=null;
let joystick={x:0,y:0,active:false};
let lastTime=0;

function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth;
 H=window.innerHeight;
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

function rand(min,max){return Math.random()*(max-min)+min}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function angleDiff(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function makeSnake(name,color,x,y,isPlayer=false){
 const s={name,color,x,y,angle:rand(0,Math.PI*2),path:[],length:100,radius:11,alive:true,isPlayer,aiTurn:0,targetAngle:0};
 for(let i=0;i<40;i++){
  s.path.push({x:x-Math.cos(s.angle)*i*3,y:y-Math.sin(s.angle)*i*3});
 }
 return s;
}

function addFood(){
 food.push({x:rand(35,WORLD.w-35),y:rand(35,WORLD.h-35),r:rand(4,7),color:["#ffca4b","#4de4c2","#fb7185","#a78bfa"][Math.floor(rand(0,4))]});
}

function resetGame(){
 score=0;
 food.length=0;
 snakes.length=0;
 player=makeSnake("تو","#22d3ee",WORLD.w/2,WORLD.h/2,true);
 snakes.push(player);

 const botColors=["#ff637d","#a78bfa","#fbbf24"];
 for(let i=0;i<3;i++){
  snakes.push(makeSnake("ربات "+(i+1),botColors[i],rand(250,WORLD.w-250),rand(250,WORLD.h-250)));
 }
 for(let i=0;i<100;i++)addFood();

 gameOver=false;
 paused=false;
 running=true;
 scoreEl.textContent="0";
 menu.classList.add("hidden");
 document.getElementById("pause").textContent="⏸ توقف";
 lastTime=performance.now();
}

function endGame(){
 if(gameOver)return;
 gameOver=true;
 running=false;
 if(score>record){
  record=score;
  localStorage.setItem("snakeRecord",record);
 }
 recordEl.textContent=record;
 menu.classList.remove("hidden");
 document.querySelector("#menuBox h1").textContent="💥 بازی تموم شد!";
 document.querySelector("#menuBox p").textContent="امتیاز تو: "+score+" | رکورد: "+record;
 document.querySelector("#start").textContent="دوباره بازی کن";
}

function respawnBot(s){
 s.x=rand(200,WORLD.w-200);
 s.y=rand(200,WORLD.h-200);
 s.angle=rand(0,Math.PI*2);
 s.path=[];
 for(let i=0;i<40;i++)s.path.push({x:s.x-Math.cos(s.angle)*i*3,y:s.y-Math.sin(s.angle)*i*3});
 s.length=100;
 s.alive=true;
}

function eatFood(s){
 for(let i=food.length-1;i>=0;i--){
  const f=food[i];
  if(distance(s,f)<s.radius+f.r+3){
   food.splice(i,1);
   s.length+=13;
   if(s.isPlayer){
    score+=10;
    coins+=1;
    scoreEl.textContent=score;
    coinsEl.textContent=coins;
    localStorage.setItem("snakeCoins",coins);
   }
   addFood();
  }
 }
}

function botAI(s,dt){
 s.aiTurn-=dt;
 if(s.aiTurn<=0){
  s.aiTurn=rand(0.4,1.2);
  let nearest=null,best=Infinity;
  for(const f of food){
   const d=distance(s,f);
   if(d<best){best=d;nearest=f}
  }
  if(nearest)s.targetAngle=Math.atan2(nearest.y-s.y,nearest.x-s.x);
  else s.targetAngle=rand(-Math.PI,Math.PI);
  const margin=180;
  if(s.x<margin)s.targetAngle=0;
  if(s.x>WORLD.w-margin)s.targetAngle=Math.PI;
  if(s.y<margin)s.targetAngle=Math.PI/2;
  if(s.y>WORLD.h-margin)s.targetAngle=-Math.PI/2;
 }
 return s.targetAngle;
}

function moveSnake(s,dt){
 if(!s.alive)return;
 let desired=s.angle;
 if(s.isPlayer){
  if(joystick.active&&Math.hypot(joystick.x,joystick.y)>0.12)desired=Math.atan2(joystick.y,joystick.x);
 }else desired=botAI(s,dt);

 const diff=angleDiff(s.angle,desired);
 s.angle+=clamp(diff,-TURN_SPEED*dt*60,TURN_SPEED*dt*60);
 const speed=(s.isPlayer?PLAYER_SPEED:BOT_SPEED)*dt*60;
 s.x+=Math.cos(s.angle)*speed;
 s.y+=Math.sin(s.angle)*speed;
 s.path.unshift({x:s.x,y:s.y});
 const maxPoints=Math.ceil(s.length/2.5);
 while(s.path.length>maxPoints)s.path.pop();
 eatFood(s);

 if(s.x<12||s.y<12||s.x>WORLD.w-12||s.y>WORLD.h-12){
  if(s.isPlayer)endGame();
  else respawnBot(s);
 }
}

function checkCollisions(){
 if(!player||!player.alive||gameOver)return;
 for(const other of snakes){
  if(other===player||!other.alive)continue;
  for(let i=12;i<other.path.length;i+=4){
   if(distance(player,other.path[i])<player.radius+other.radius-3){endGame();return}
  }
 }
 for(let i=25;i<player.path.length;i+=4){
  if(distance(player,player.path[i])<player.radius*1.5){endGame();return}
 }
}

function drawSnake(s){
 if(!s.alive||s.path.length<2)return;
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.beginPath();
 ctx.moveTo(s.path[0].x,s.path[0].y);
 for(let i=1;i<s.path.length;i++)ctx.lineTo(s.path[i].x,s.path[i].y);
 ctx.strokeStyle=s.color;
 ctx.lineWidth=s.radius*1.8;
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);
 ctx.fillStyle=s.color;
 ctx.fill();

 const ex=Math.cos(s.angle+Math.PI/2)*4;
 const ey=Math.sin(s.angle+Math.PI/2)*4;
 for(const side of [-1,1]){
  const px=s.x+Math.cos(s.angle)*5+ex*side;
  const py=s.y+Math.sin(s.angle)*5+ey*side;
  ctx.beginPath();
  ctx.arc(px,py,2.5,0,Math.PI*2);
  ctx.fillStyle="#07111c";
  ctx.fill();
 }

 if(!s.isPlayer){
  ctx.font="12px Tahoma";
  ctx.textAlign="center";
  ctx.fillStyle="white";
  ctx.fillText(s.name,s.x,s.y-22);
 }
}

function drawWorld(){
 ctx.fillStyle="#091725";
 ctx.fillRect(0,0,WORLD.w,WORLD.h);
 ctx.strokeStyle="#173047";
 ctx.lineWidth=1;
 for(let x=0;x<=WORLD.w;x+=60){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD.h);ctx.stroke();
 }
 for(let y=0;y<=WORLD.h;y+=60){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD.w,y);ctx.stroke();
 }
 ctx.strokeStyle="#e35b76";
 ctx.lineWidth=8;
 ctx.strokeRect(0,0,WORLD.w,WORLD.h);
 for(const f of food){
  ctx.beginPath();
  ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
  ctx.fillStyle=f.color;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(f.x-2,f.y-2,1.5,0,Math.PI*2);
  ctx.fillStyle="#ffffffaa";
  ctx.fill();
 }
}

function render(){
 ctx.clearRect(0,0,W,H);
 const camX=player?clamp(player.x-W/2,0,WORLD.w-W):0;
 const camY=player?clamp(player.y-H/2,0,WORLD.h-H):0;
 ctx.save();
 ctx.translate(-camX,-camY);
 drawWorld();
 for(const s of snakes)drawSnake(s);
 ctx.restore();
}

function loop(now){
 requestAnimationFrame(loop);
 if(!running||paused||gameOver)return;
 const dt=Math.min((now-lastTime)/16.67,2);
 lastTime=now;
 for(const s of snakes)moveSnake(s,dt);
 checkCollisions();
 render();
}
requestAnimationFrame(loop);

function updateStick(e){
 const rect=pad.getBoundingClientRect();
 const cx=rect.left+rect.width/2;
 const cy=rect.top+rect.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=rect.width*0.34;
 const len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joystick.x=dx/max;
 joystick.y=dy/max;
 stick.style.left=(rect.width/2-29+dx)+"px";
 stick.style.top=(rect.height/2-29+dy)+"px";
}

pad.addEventListener("pointerdown",e=>{
 e.preventDefault();
 joystick.active=true;
 pad.setPointerCapture(e.pointerId);
 updateStick(e);
});
pad.addEventListener("pointermove",e=>{
 if(joystick.active)updateStick(e);
});
function releaseStick(){
 joystick.active=false;
 joystick.x=0;
 joystick.y=0;
 stick.style.left="42px";
 stick.style.top="42px";
}
pad.addEventListener("pointerup",releaseStick);
pad.addEventListener("pointercancel",releaseStick);

document.getElementById("start").addEventListener("click",()=>{
 document.querySelector("#menuBox h1").textContent="🐍 SNAKE ARENA";
 document.querySelector("#menuBox p").textContent="آماده‌ای وارد میدان بشی؟";
 resetGame();
});
document.getElementById("restart").addEventListener("click",resetGame);
document.getElementById("pause").addEventListener("click",()=>{
 if(!running||gameOver)return;
 paused=!paused;
 document.getElementById("pause").textContent=paused?"▶ ادامه":"⏸ توقف";
 if(!paused)lastTime=performance.now();
});
recordEl.textContent=record;
coinsEl.textContent=coins;
render();
</script>
</body>
</html>

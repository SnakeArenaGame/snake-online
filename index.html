
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08111f;color:white;font-family:Arial,Tahoma;overflow:hidden}
button,input,select{font:inherit}
button{border:0;border-radius:12px;padding:12px;background:#16a36a;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.screen{display:none;min-height:100dvh;padding:16px;overflow:auto}
.screen.active{display:flex;flex-direction:column;align-items:center}
h1{color:#35e69b}
.panel{width:min(100%,460px);background:#142238;border:1px solid #263d5c;border-radius:18px;padding:16px;margin:9px 0}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #40536d;background:#0b1728;color:white;margin:7px 0}
.full{width:100%;margin-top:8px}
.secondary{background:#30445e}
.danger{background:#bd394d}
.player{display:flex;align-items:center;gap:10px;padding:9px;background:#0c192a;border-radius:10px;margin:6px 0}
.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#284b65}
#gameScreen{padding:0;position:relative;overflow:hidden;min-height:100dvh}
#gameCanvas{width:100vw;height:100dvh;display:block;touch-action:none}
#gameTop{position:absolute;top:8px;left:8px;right:8px;z-index:3;display:flex;justify-content:space-between;gap:7px;pointer-events:none}
.stat{background:#102139dd;border:1px solid #36516b;border-radius:10px;padding:8px;font-size:12px}
#joystick{position:absolute;bottom:28px;left:25px;width:145px;height:145px;border-radius:50%;background:#ffffff20;border:3px solid #ffffff55;z-index:5;touch-action:none;display:grid;place-items:center}
#knob{width:60px;height:60px;border-radius:50%;background:#35e69b;border:3px solid #d5fff0;box-shadow:0 3px 15px #0008;pointer-events:none}
#gameButtons{position:absolute;bottom:20px;right:14px;z-index:5;display:flex;flex-direction:column;gap:8px}
#gameButtons button{background:#142b43dd;border:1px solid #49627c;padding:10px;font-size:12px}
#gameOver{display:none;position:absolute;inset:0;background:#06101ddd;z-index:8;align-items:center;justify-content:center;padding:20px}
#gameOver .panel{text-align:center}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:40;background:#152b43;padding:10px 15px;border-radius:10px;display:none;max-width:90%;text-align:center}
#profileModal{display:none;position:fixed;inset:0;background:#000c;z-index:30;align-items:center;justify-content:center;padding:18px}
#profileModal .panel{max-width:400px}
</style>
</head>
<body>

<div id="toast"></div>

<section id="home" class="screen active">
<h1>🐍 SNAKE ARENA</h1>
<div>بازی آنلاین مارها</div>
<div class="panel">
<h2>👤 پروفایل</h2>
<div id="profileInfo"></div>
<button class="secondary full" onclick="editProfile()">ویرایش پروفایل</button>
</div>
<div class="panel">
<h2>🎮 شروع بازی</h2>
<button class="full" onclick="startSolo()">بازی تک‌نفره با ربات</button>
<button class="full" onclick="createRoom()">ساخت اتاق آنلاین</button>
<input id="roomInput" placeholder="کد اتاق یا لینک دعوت">
<button class="secondary full" onclick="joinRoom()">پیوستن به اتاق</button>
</div>
<div class="panel">
<h2>🏆 رکوردها</h2>
<div id="records"></div>
</div>
</section>

<section id="lobby" class="screen">
<h1>🏠 اتاق بازی</h1>
<div class="panel">
<div>کد اتاق: <b id="roomCode">---</b></div>
<button class="secondary full" onclick="copyInvite()">📨 کپی لینک دعوت</button>
<div id="roomStatus"></div>
</div>
<div class="panel">
<h2>👥 بازیکنان</h2>
<div id="playersList"></div>
</div>
<div class="panel" id="hostOptions">
<h2>⚙️ تنظیمات</h2>
<select id="modeSelect" onchange="updateLobby()">
<option value="2">۱ به ۱</option>
<option value="3">۱ به ۲</option>
<option value="4">۲ به ۲</option>
</select>
<select id="durationSelect">
<option value="60">۱ دقیقه</option>
<option value="120">۲ دقیقه</option>
<option value="180">۳ دقیقه</option>
<option value="300">۵ دقیقه</option>
</select>
<button class="full" id="startButton" onclick="startOnline()">شروع مسابقه</button>
</div>
<div class="panel" id="guestMessage" style="display:none">منتظر شروع مسابقه توسط میزبان...</div>
<button class="danger full" onclick="leaveRoom()">خروج از اتاق</button>
</section>

<section id="gameScreen" class="screen">
<div id="gameTop">
<div class="stat">⏱ <span id="timer">0</span></div>
<div class="stat">🏆 <span id="score">0</span></div>
<div class="stat">👥 <span id="alive">0</span></div>
</div>
<canvas id="gameCanvas"></canvas>
<div id="joystick"><div id="knob"></div></div>
<div id="gameButtons">
<button onclick="restartGame()">🔄 شروع مجدد</button>
<button onclick="backToRoom()">🏠 بازگشت</button>
</div>
<div id="gameOver">
<div class="panel">
<h2>🏁 مسابقه تمام شد!</h2>
<div id="winnerText"></div>
<button class="full" onclick="restartGame()">بازی دوباره</button>
<button class="secondary full" onclick="backToRoom()">بازگشت</button>
</div>
</div>
</section>

<div id="profileModal">
<div class="panel">
<h2>ساخت پروفایل</h2>
<input id="nameInput" maxlength="16" placeholder="اسم بازیکن">
<select id="genderInput">
<option value="👦">پسر</option>
<option value="👧">دختر</option>
<option value="🙂">ترجیح می‌دهم نگویم</option>
</select>
<button class="full" onclick="saveProfile()">ذخیره</button>
</div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const STORAGE="snakeArenaProfileV5";
const W=30,H=19;
const COLORS=["#36e69b","#ffcb55","#61a9ff","#ff6b88"];

let profile=null;
try{profile=JSON.parse(localStorage.getItem(STORAGE)||"null")}catch(e){}

let pendingAction="";
let peer=null,conn=null;
let connections=new Map();
let roomId="",isHost=false,soloMode=false;
let players=[],game=null;
let gameTimer=null,renderTimer=null;
let secondsLeft=0,lastSavedScore=0;
let joystickPointer=null;
let directionQueue=null;

const canvas=$("gameCanvas");
const ctx=canvas.getContext("2d");

function toast(message){
 $("toast").textContent=message;
 $("toast").style.display="block";
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>$("toast").style.display="none",2500);
}

function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 $(id).classList.add("active");
}

function profileSetup(action){
 if(profile)return true;
 pendingAction=action;
 $("profileModal").style.display="flex";
 return false;
}

function editProfile(){
 $("nameInput").value=profile?.name||"";
 $("genderInput").value=profile?.avatar||"👦";
 pendingAction="";
 $("profileModal").style.display="flex";
}

function saveProfile(){
 const name=$("nameInput").value.trim();
 if(name.length<2){toast("اسم حداقل ۲ حرف باشد");return}
 profile=profile||{total:0,best:0};
 profile.name=name;
 profile.avatar=$("genderInput").value;
 profile.total=Number(profile.total)||0;
 profile.best=Number(profile.best)||0;
 localStorage.setItem(STORAGE,JSON.stringify(profile));
 $("profileModal").style.display="none";
 refreshProfile();
 toast("پروفایل ذخیره شد");
 const action=pendingAction;
 pendingAction="";
 if(action==="solo")startSolo();
 if(action==="create")createRoom();
 if(action==="join")joinRoom();
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function refreshProfile(){
 if(!profile)return;
 $("profileInfo").innerHTML=
 `<div class="player"><div class="avatar">${escapeHTML(profile.avatar)}</div><b>${escapeHTML(profile.name)}</b></div>
 <div>امتیاز کل: ${profile.total||0}</div>
 <div>رکورد: ${profile.best||0}</div>`;
 $("records").textContent=`امتیاز کل: ${profile.total||0} | رکورد: ${profile.best||0}`;
}

function savePoints(value){
 if(!profile)return;
 const diff=Math.max(0,value-lastSavedScore);
 if(diff>0){
  profile.total=(profile.total||0)+diff;
  profile.best=Math.max(profile.best||0,value);
  localStorage.setItem(STORAGE,JSON.stringify(profile));
  refreshProfile();
 }
 lastSavedScore=value;
}

function randomCode(){
 return "sa"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
}

function connectPeer(id){
 return new Promise((resolve,reject)=>{
  if(typeof Peer==="undefined"){
   reject(new Error("PeerJS unavailable"));
   return;
  }
  peer=new Peer(id||undefined);
  let finished=false;
  const timeout=setTimeout(()=>{
   if(!finished){finished=true;reject(new Error("Connection timeout"))}
  },15000);

  peer.on("open",()=>{
   if(finished)return;
   finished=true;
   clearTimeout(timeout);
   resolve();
  });

  peer.on("error",e=>{
   if(!finished){
    finished=true;
    clearTimeout(timeout);
    reject(e);
   }else toast("خطای اتصال: "+e.type);
  });

  peer.on("connection",c=>{
   if(isHost)hostConnection(c);
  });
 });
}

function makePlayer(id,name,avatar,index){
 const spots=[[4,9],[25,9],[4,15],[25,15]];
 const p=spots[index%4];
 return {
  id,name,avatar,color:COLORS[index%4],
  x:p[0],y:p[1],
  dir:{x:index%2===0?1:-1,y:0},
  snake:[],score:0,alive:true,
  bot:false,botDeadline:0,steps:0,elapsed:0
 };
}

async function createRoom(){
 if(!profileSetup("create"))return;
 cleanupPeer();
 isHost=true;
 soloMode=false;
 roomId=randomCode();

 try{
  await connectPeer(roomId);
  players=[makePlayer(peer.id,profile.name,profile.avatar,0)];
  connections.clear();
  $("roomCode").textContent=roomId;
  $("hostOptions").style.display="block";
  $("guestMessage").style.display="none";
  show("lobby");
  updateLobby();
  toast("اتاق ساخته شد");
 }catch(e){
  isHost=false;
  roomId="";
  cleanupPeer();
  toast("ساخت اتاق ناموفق بود؛ دوباره تلاش کن");
 }
}

function hostConnection(c){
 connections.set(c.peer,c);

 c.on("data",d=>{
  if(!d||!d.type)return;

  if(d.type==="join"){
   if(players.length>=Number($("modeSelect").value)||players.length>=4){
    c.send({type:"full"});
    c.close();
    return;
   }
   if(players.some(p=>p.id===c.peer))return;

   players.push(makePlayer(c.peer,d.name,d.avatar,players.length));
   broadcast({type:"lobby",players});
   updateLobby();
  }

  if(d.type==="dir"){
   const p=players.find(x=>x.id===c.peer);
   if(p&&p.alive&&validDirection(p.dir,d.dir)){
    p.dir=d.dir;
   }
  }

  if(d.type==="restart"){
   if(isHost&&game?.over)startOnline();
  }

  if(d.type==="leave")removePlayer(c.peer);
 });

 c.on("close",()=>removePlayer(c.peer));
 c.on("error",()=>toast("خطای اتصال بازیکن"));
}

function removePlayer(id){
 connections.delete(id);
 players=players.filter(p=>p.id!==id);
 if(isHost){
  updateLobby();
  broadcast({type:"lobby",players});
 }
}

function broadcast(data){
 connections.forEach(c=>{
  if(c.open){
   try{c.send(data)}catch(e){}
  }
}

function updateLobby(){
 $("playersList").innerHTML="";
 players.forEach(p=>{
  const d=document.createElement("div");
  d.className="player";
  d.innerHTML=`<div class="avatar">${escapeHTML(p.avatar)}</div><b>${escapeHTML(p.name)}</b>${p.id===peer?.id?" (میزبان)":""}`;
  $("playersList").appendChild(d);
 });
 const needed=Number($("modeSelect").value||2);
 $("roomStatus").textContent=`${players.length} از ${needed} بازیکن`;
 $("startButton").disabled=!isHost||players.length!==needed;
}

async function joinRoom(){
 if(!profileSetup("join"))return;

 let value=$("roomInput").value.trim();
 const match=value.match(/[?&]room=([^&]+)/);
 if(match){
  try{value=decodeURIComponent(match[1])}catch(e){}
 }
 if(!value){toast("کد اتاق را وارد کن");return}

 cleanupPeer();
 roomId=value;
 isHost=false;
 soloMode=false;

 try{
  await connectPeer();
  conn=peer.connect(roomId,{reliable:true});

  conn.on("open",()=>{
   conn.send({type:"join",name:profile.name,avatar:profile.avatar});
   $("roomCode").textContent=roomId;
   $("hostOptions").style.display="none";
   $("guestMessage").style.display="block";
   show("lobby");
   toast("درخواست ورود ارسال شد");
  });

  conn.on("data",handleGuestData);
  conn.on("close",()=>toast("اتصال میزبان قطع شد"));
  conn.on("error",()=>toast("خطای اتصال به اتاق"));

 }catch(e){
  cleanupPeer();
  toast("اتصال انجام نشد؛ کد اتاق را بررسی کن");
 }
}

function handleGuestData(d){
 if(d.type==="full"){
  toast("ظرفیت اتاق تکمیل است");
  return;
 }

 if(d.type==="lobby"){
  players=d.players||[];
  $("roomStatus").textContent=`${players.length} بازیکن در اتاق`;
  $("playersList").innerHTML="";
  players.forEach(p=>{
   const el=document.createElement("div");
   el.className="player";
   el.innerHTML=`<div class="avatar">${escapeHTML(p.avatar)}</div><b>${escapeHTML(p.name)}</b>`;
   $("playersList").appendChild(el);
  });
 }

 if(d.type==="start"){
  game=d.game;
  secondsLeft=d.duration;
  lastSavedScore=0;
  show("gameScreen");
  $("gameOver").style.display="none";
  startRendering();
  updateGameStats();
 }

 if(d.type==="state"){
  game=d.game;
  secondsLeft=d.time;
  const me=game.players.find(p=>p.id===peer?.id);
  if(me)savePoints(me.score);
  updateGameStats();
  if(game.over)showGameOver();
 }

 if(d.type==="end"){
  game=d.game;
  showGameOver();
 }
}

function copyInvite(){
 if(!roomId){toast("اول اتاق بساز");return}
 const url=location.origin+location.pathname+"?room="+encodeURIComponent(roomId);

 if(navigator.clipboard&&location.protocol==="https:"){
  navigator.clipboard.writeText(url)
   .then(()=>toast("لینک کپی شد"))
   .catch(()=>toast(url));
 }else{
  toast(url);
 }
}

function cleanupPeer(){
 try{if(conn)conn.close()}catch(e){}
 try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}
 peer=null;
 conn=null;
 connections.clear();
}

function leaveRoom(){
 stopLoops();
 if(isHost){
  broadcast({type:"end",game});
 }else if(conn&&conn.open){
  try{conn.send({type:"leave"})}catch(e){}
 }
 cleanupPeer();
 players=[];
 roomId="";
 isHost=false;
 game=null;
 show("home");
}

function backToRoom(){
 stopLoops();
 $("gameOver").style.display="none";
 show(soloMode?"home":"lobby");
}

function randomBotTime(){
 const choices=[600,900,1800+Math.floor(Math.random()*1801)];
 return choices[Math.floor(Math.random()*choices.length)];
}

function startSolo(){
 if(!profileSetup("solo"))return;
 cleanupPeer();
 isHost=true;
 soloMode=true;
 roomId="";

 players=[makePlayer("solo",profile.name,profile.avatar,0)];

 for(let i=1;i<=3;i++){
  const b=makePlayer("bot"+i,"ربات "+i,"🤖",i);
  b.bot=true;
  b.botDeadline=randomBotTime();
  players.push(b);
 }

 startGame(Math.max(...players.filter(p=>p.bot).map(p=>p.botDeadline))+60);
}

function startOnline(){
 if(!isHost)return;
 const needed=Number($("modeSelect").value);
 if(players.length!==needed){
  toast("تعداد بازیکنان کامل نیست");
  return;
 }
 soloMode=false;
 startGame(Number($("durationSelect").value));
}

function startGame(duration){
 secondsLeft=duration;
 lastSavedScore=0;
 directionQueue=null;

 players.forEach((p,i)=>{
  p.score=0;
  p.alive=true;
  const spots=[[4,9],[25,9],[4,15],[25,15]];
  p.x=spots[i][0];
  p.y=spots[i][1];
  p.dir={x:i%2===0?1:-1,y:0};
  p.snake=[
   {x:p.x,y:p.y},
   {x:p.x-p.dir.x,y:p.y},
   {x:p.x-2*p.dir.x,y:p.y}
  ];
  p.elapsed=0;
  p.steps=0;
 });

 game={players,food:null,over:false,tick:0};
 game.food=randomFood();

 show("gameScreen");
 $("gameOver").style.display="none";
 stopLoops();

 if(isHost){
  broadcast({type:"start",game,duration});
  gameTimer=setInterval(hostTick,140);
 }

 startRendering();
 updateGameStats();
}

function randomFood(){
 let free=[];
 for(let y=0;y<H;y++){
  for(let x=0;x<W;x++){
   const occupied=game?.players?.some(p=>
    p.snake?.some(s=>s.x===x&&s.y===y)
   );
   if(!occupied)free.push({x,y});
  }
 }
 if(!free.length)return {x:Math.floor(W/2),y:Math.floor(H/2)};
 return free[Math.floor(Math.random()*free.length)];
}

function hostTick(){
 if(!game||game.over)return;

 game.tick++;

 if(game.tick%7===0){
  secondsLeft=Math.max(0,secondsLeft-1);
  game.players.forEach(p=>{
   if(p.alive){
    p.elapsed++;
    p.score++;
   }
  });
 }

 game.players.forEach(p=>{
  if(!p.alive)return;

  if(p.bot)botThink(p);

  const nx=p.x+p.dir.x;
  const ny=p.y+p.dir.y;

  const hitWall=nx<0||ny<0||nx>=W||ny>=H;
  const hitBody=p.snake.some((s,i)=>
   i<p.snake.length-1&&s.x===nx&&s.y===ny
  );
  const hitOther=game.players.some(q=>
   q!==p&&q.alive&&q.snake.some(s=>s.x===nx&&s.y===ny)
  );

  if(hitWall||hitBody||hitOther){
   p.alive=false;
   return;
  }

  p.x=nx;
  p.y=ny;
  p.snake.unshift({x:p.x,y:p.y});

  if(game.food&&p.x===game.food.x&&p.y===game.food.y){
   p.score+=10;
   game.food=randomFood();
  }else{
   p.snake.pop();
  }

  if(p.bot&&p.elapsed>=p.botDeadline)p.alive=false;
 });

 const alive=game.players.filter(p=>p.alive).length;

 if(alive<=1||secondsLeft<=0){
  game.over=true;
  broadcast({type:"end",game});
  showGameOver();
  return;
 }

 if(game.tick%2===0){
  broadcast({type:"state",game,time:secondsLeft});
 }

 const me=game.players.find(p=>p.id===peer?.id||p.id==="solo");
 if(me)savePoints(me.score);

 updateGameStats();
}

/* ربات‌ها با جست‌وجوی مسیر به غذا می‌رسند؛ خانه‌های لبه هم مجازند. */
function botThink(p){
 const food=game.food;
 if(!food)return;

 const directions=[
  {x:1,y:0},{x:-1,y:0},
  {x:0,y:1},{x:0,y:-1}
 ];

 const start=p.x+p.y*W;
 const target=food.x+food.y*W;
 const blocked=new Set();

 game.players.forEach(q=>{
  if(!q.alive)return;
  q.snake.forEach((s,i)=>{
   if(q===p&&i===q.snake.length-1)return;
   blocked.add(s.x+s.y*W);
  });
 });

 blocked.delete(start);

 const queue=[start];
 const previous=new Int32Array(W*H);
 previous.fill(-2);
 previous[start]=-1;

 let found=false;
 let head=0;

 while(head<queue.length){
  const at=queue[head++];
  if(at===target){found=true;break}

  const x=at%W;
  const y=Math.floor(at/W);

  for(const d of directions){
   const nx=x+d.x;
   const ny=y+d.y;

   if(nx<0||ny<0||nx>=W||ny>=H)continue;

   const next=nx+ny*W;
   if(previous[next]!==-2||blocked.has(next))continue;

   previous[next]=at;
   queue.push(next);
  }
 }

 if(found&&target!==start){
  let step=target;

  while(previous[step]!==start&&previous[step]!==-1){
   step=previous[step];
  }

  if(previous[step]===start){
   const d={
    x:(step%W)-p.x,
    y:Math.floor(step/W)-p.y
   };
   if(validDirection(p.dir,d)){
    p.dir=d;
    return;
   }
  }
 }

 const safe=directions.filter(d=>{
  if(!validDirection(p.dir,d))return false;
  const x=p.x+d.x;
  const y=p.y+d.y;
  if(x<0||y<0||x>=W||y>=H)return false;
  return !blocked.has(x+y*W);
 });

 if(safe.length){
  safe.sort((a,b)=>{
   const da=Math.abs(p.x+a.x-food.x)+Math.abs(p.y+a.y-food.y);
   const db=Math.abs(p.x+b.x-food.x)+Math.abs(p.y+b.y-food.y);
   return da-db;
  });
  p.dir=safe[0];
 }
